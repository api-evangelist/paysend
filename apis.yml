name: Paysend
kind: company
description: >-
  Paysend is a London-headquartered global fintech, founded in 2017, building a
  cross-border digital payments network that moves money to bank accounts,
  cards, and wallets across 170+ countries in 40+ currencies for more than 11
  million consumers and a growing base of enterprise clients. Alongside its
  consumer money-transfer app, Paysend operates Paysend Enterprise, a
  business-facing payments platform whose developer surface is a single Payout
  API: one integration disburses funds worldwide to cards and accounts, with FX
  rate lookups, bank and card tokenization utilities, partner statements, and
  balance queries. The API is a partner-provisioned, enterprise integration
  (United Kingdom home market) rather than a fully public self-serve product —
  authentication is API key plus HMAC digital signature (X-OPP-Signature),
  requests are idempotent via a request id and date, and payout status is
  delivered through configurable webhook notifications. Paysend documents this
  surface openly on a Docusaurus developer portal with a sandbox mock service,
  but does not publish a downloadable OpenAPI/Swagger definition or a public
  base URL.
