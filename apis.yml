apis:
- aid: paysend:paysend-enterprise-payout-api
  name: Paysend Enterprise Payout API
  description: >-
    Paysend Enterprise's single Payout API disburses funds worldwide to cards
    and bank accounts through the Paysend payments network. A multi-task POST
    /processing endpoint carries operations including pay.toCard, pay.toAccount,
    fx.rateGet / fx.rateGet.p2a, bank.get / bank.search, card.createToken /
    card.infoGet, partner.statementGet, getBalance, and task.statusGet, with a
    companion GET /processing/status/ for status retrieval. Authentication is
    API key plus HMAC digital signature (X-OPP-Signature, SHA-256/512); requests
    are made idempotent via header.request.id and header.request.date, and
    payment outcomes are pushed to configurable webhook notification URLs. A
    sandbox mock service is provided. No downloadable OpenAPI specification or
    public base URL is published; the surface is partner-provisioned.
  humanURL: https://developer.paysend.com/product-overview/
